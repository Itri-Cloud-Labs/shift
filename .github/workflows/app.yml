name: Client foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blacksmith runners, except macOS Intel, which Blacksmith does not offer.
          - runner: blacksmith-4vcpu-ubuntu-2204
            platform: linux
            arch: x64
          - runner: blacksmith-4vcpu-windows-2025
            platform: win32
            arch: x64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Secrets cannot be tested in a step condition, so whether one exists is passed on here.
      APPLE_API_KEY_SET: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node -e 'if (process.platform !== "${{ matrix.platform }}" || process.arch !== "${{ matrix.arch }}") process.exit(1)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm protocol:check
      - run: pnpm --filter @shift/app typecheck
      - run: pnpm --filter @shift/app test
      # Signing identities come only from repository secrets. Without them the installers are
      # built and named unsigned; a pull request from a fork never sees them.
      - name: Prepare the notarization key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_SET == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build the installers
        run: pnpm --filter @shift/app package
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @shift/app smoke:packaged
      - if: runner.os != 'Linux'
        run: pnpm --filter @shift/app smoke:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shift-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/app/release/Shift-*
            apps/app/release/SHA256SUMS
            apps/app/release/release.json
          if-no-files-found: error
          retention-days: 14

  service:
    name: Desktop against the Linux service
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus xvfb
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 1
          done
      - name: Build the server release and the packaged app
        run: |
          pnpm --filter @shift/server package:linux
          SHIFT_BUILD_LIVE_SMOKE=1 pnpm --filter @shift/app package:dir
      # The runner is disposable: the server is installed as its account's service, behind Caddy.
      - name: Pair, quit and reopen the packaged app against the installed service
        run: bash apps/app/tools/live-service.sh apps/server/build/packages
