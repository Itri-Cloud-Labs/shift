name: Server foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc 2.35 baseline for the native SQLite binding.
          - runner: blacksmith-4vcpu-ubuntu-2204
            arch: x64
          - runner: blacksmith-4vcpu-ubuntu-2204-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node -e 'if (process.platform !== "linux" || process.arch !== "${{ matrix.arch }}") process.exit(1)'
      - run: getconf GNU_LIBC_VERSION
      - run: pnpm install --frozen-lockfile
      # Harness containment tests run OpenCode stand-ins inside systemd user scopes.
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 1
          done
          XDG_RUNTIME_DIR="$runtime_dir" systemd-run --user --scope --quiet true
      - run: pnpm check
        env:
          SHIFT_TEST_REQUIRE_SYSTEMD: '1'
      - run: node apps/server/tools/platform-smoke.mjs ${{ matrix.arch }}

  service:
    name: Linux service ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2204
            arch: x64
          - runner: blacksmith-4vcpu-ubuntu-2204-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 1
          done
      - run: pnpm --filter @shift/server build
      - run: node apps/server/packaging/bundle.mjs --arch ${{ matrix.arch }}
      # The runner is disposable: this installs the release as the runner account's own service.
      - name: Install and operate the service
        run: bash apps/server/packaging/service-acceptance.sh apps/server/build/packages
      # A server on its own 64 MiB file system, which is then filled.
      - name: Fill the disk under a running server
        run: |
          small=$(mktemp -d)
          sudo mount -t tmpfs -o "size=64m,mode=700,uid=$(id -u),gid=$(id -g)" tmpfs "$small"
          SHIFT="$HOME/.local/bin/shift" bash apps/server/packaging/storage-failure.sh "$small"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shift-server-linux-${{ matrix.arch }}
          path: |
            apps/server/build/packages/shift-*.tar.gz
            apps/server/build/packages/SHA256SUMS
            apps/server/build/packages/install.sh
          if-no-files-found: error
          retention-days: 14
